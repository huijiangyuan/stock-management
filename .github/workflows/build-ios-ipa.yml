name: Build iOS IPA (StockManager)

# 触发：main 分支推送自动构建；也可手动在 Actions 页指定分支触发。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支 / tag / SHA（留空用默认分支）"
        required: false
        default: ""

# 同一分支只保留最新一次运行，避免排队浪费 macOS runner 分钟数。
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 主路径：未签名 IPA（配合 SideStore + LiveContainer 免费侧载）
  # 无需任何 Apple 开发者账号 / 证书 / provisioning profile。
  #
  # 端侧推理：llama.cpp-omni 子模块 + scripts/build_xcframework.sh 产出
  # ios-app/Frameworks/llama.xcframework，按子模块 commit + Xcode 版本 + 构建脚本
  # 哈希做缓存，避免每次重建（约 10~12 min）。
  # ─────────────────────────────────────────────────────────────
  build-unsigned:
    name: Unsigned IPA (free sideload)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout (含子模块)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          lfs: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install xcodegen cmake

      - name: 计算 xcframework 缓存 key
        id: cachekey
        run: |
          set -euo pipefail
          LLAMACPP_COMMIT=$(git ls-tree HEAD ios-app/llama.cpp-omni | awk '{print $3}')
          echo "llamacpp_commit=$LLAMACPP_COMMIT" >> "$GITHUB_OUTPUT"
          xcodebuild -version > /tmp/xcode_version.txt 2>&1
          XCODE_VERSION=$(head -1 /tmp/xcode_version.txt | tr ' ' '-')
          echo "xcode_version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          SCRIPT_HASH=$(shasum -a 256 ios-app/scripts/build_xcframework.sh | awk '{print $1}')
          echo "script_hash=$SCRIPT_HASH" >> "$GITHUB_OUTPUT"
          echo "llama.cpp-omni @ $LLAMACPP_COMMIT | xcode $XCODE_VERSION | script $SCRIPT_HASH"

      - name: 缓存 llama.xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: ios-app/Frameworks/llama.xcframework
          key: llama-xcframework-ios-universal-${{ steps.cachekey.outputs.llamacpp_commit }}-${{ steps.cachekey.outputs.xcode_version }}-${{ steps.cachekey.outputs.script_hash }}
          restore-keys: |
            llama-xcframework-ios-universal-${{ steps.cachekey.outputs.llamacpp_commit }}-

      - name: 构建 llama.xcframework（缓存未命中时）
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        working-directory: ios-app
        run: |
          set -euo pipefail
          # 同时构建 device + simulator：归档使用真机切片，单元测试使用模拟器切片。
          MINIMAL_MODE=ios ./scripts/build_xcframework.sh

      # actions/cache 的自动 post-save 在后续测试失败时可能跳过；底层框架一旦
      # 构建成功就立即保存，避免修 Swift 编译错误时反复耗时重建 C++。
      - name: 立即保存 llama.xcframework 缓存
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios-app/Frameworks/llama.xcframework
          key: llama-xcframework-ios-universal-${{ steps.cachekey.outputs.llamacpp_commit }}-${{ steps.cachekey.outputs.xcode_version }}-${{ steps.cachekey.outputs.script_hash }}

      - name: Generate Xcode project from project.yml
        working-directory: ios-app
        run: xcodegen generate

      - name: Run unit tests
        working-directory: ios-app
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime in devices.values() for d in runtime if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator")
          print(iphones[0]["udid"])
          ')
          xcodebuild test \
            -project StockInventoryApp.xcodeproj \
            -scheme StockInventoryApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive (no code signing)
        working-directory: ios-app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project StockInventoryApp.xcodeproj \
            -scheme StockInventoryApp \
            -configuration Release \
            -archivePath build/StockInventoryApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          # 兜底校验：archive 必须存在，否则下方打包会失败
          test -d build/StockInventoryApp.xcarchive

      - name: Assert Info.plist 含隐私权限键
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/StockInventoryApp.xcarchive/Products -name '*.app' | head -n 1)
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            plutil -extract "$key" raw "$APP_PATH/Info.plist" > /dev/null \
              || { echo "::error::$key missing from bundle Info.plist!"; exit 1; }
          done
          echo "Info.plist 隐私权限键校验通过"

      - name: Assert MobileCLIP 模型已编译进 App
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/StockInventoryApp.xcarchive/Products -name '*.app' | head -n 1)
          MODEL_PATH=$(find "$APP_PATH" -name 'mobileclip_s0_image.mlmodelc' -type d | head -n 1)
          test -n "$MODEL_PATH" || { echo "::error::MobileCLIP compiled model missing from app bundle"; exit 1; }
          MODEL_KB=$(du -sk "$MODEL_PATH" | awk '{print $1}')
          test "$MODEL_KB" -gt 10000 \
            || { echo "::error::MobileCLIP compiled model bundle is unexpectedly small: ${MODEL_KB}KB"; exit 1; }
          for license in MobileCLIP-LICENSE_MODELS.txt NextLevel-LICENSE.txt; do
            find "$APP_PATH" -name "$license" -type f | grep -q . \
              || { echo "::error::$license missing from app bundle"; exit 1; }
          done
          du -sh "$MODEL_PATH"

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/StockInventoryApp.xcarchive/Products -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r StockInventoryApp-unsigned.ipa Payload
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp StockInventoryApp-unsigned.ipa "StockManager-${SHORT_SHA}.ipa"
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockInventoryApp-unsigned-ipa
          path: ios-app/build/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish to Public Release (公开免登录直链下载)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: StockManager 最新未签名构建 (公开免登录版)
          body: |
            ## 📱 最新侧载安装包自动发布
            - **Commit**: `${{ github.sha }}`
            - **适用环境**: SideStore / TrollStore / LiveContainer 侧载免签名安装
            - **说明**: 任何人均可公开免登录点击附件直接下载 `.ipa` 文件。
          files: |
            ios-app/build/StockInventoryApp-unsigned.ipa
            ios-app/build/StockManager-*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 可选路径：真签名 IPA（需付费 Apple Developer 账号）。
  # 仅当仓库变量 SIGNED_BUILD=true 时才运行；缺 Secrets 会失败但不影响上面的未签名产物。
  # 需要的仓库 Secrets：
  #   SIGN_CERT_P12_BASE64        base64 后的 .p12 证书
  #   SIGN_CERT_PASSWORD          p12 导出密码
  #   SIGN_KEYCHAIN_PASSWORD      临时 keychain 密码（随便设）
  #   SIGN_PROVISIONING_PROFILE_BASE64  base64 后的 .mobileprovision
  #   SIGN_TEAM_ID                10 位团队 ID
  #   SIGN_PROFILE_SPECIFIER      provisioning profile 名称
  # ─────────────────────────────────────────────────────────────
  export-signed:
    name: Signed IPA (optional, paid account)
    runs-on: macos-15
    if: ${{ vars.SIGNED_BUILD == 'true' }}
    needs: build-unsigned
    steps:
      - name: Checkout (含子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: brew install xcodegen cmake

      - name: 计算 xcframework 缓存 key
        id: cachekey
        run: |
          set -euo pipefail
          LLAMACPP_COMMIT=$(git ls-tree HEAD ios-app/llama.cpp-omni | awk '{print $3}')
          echo "llamacpp_commit=$LLAMACPP_COMMIT" >> "$GITHUB_OUTPUT"
          xcodebuild -version > /tmp/xcode_version.txt 2>&1
          XCODE_VERSION=$(head -1 /tmp/xcode_version.txt | tr ' ' '-')
          echo "xcode_version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          SCRIPT_HASH=$(shasum -a 256 ios-app/scripts/build_xcframework.sh | awk '{print $1}')
          echo "script_hash=$SCRIPT_HASH" >> "$GITHUB_OUTPUT"

      - name: 缓存 llama.xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: ios-app/Frameworks/llama.xcframework
          key: llama-xcframework-ios-universal-${{ steps.cachekey.outputs.llamacpp_commit }}-${{ steps.cachekey.outputs.xcode_version }}-${{ steps.cachekey.outputs.script_hash }}
          restore-keys: |
            llama-xcframework-ios-universal-${{ steps.cachekey.outputs.llamacpp_commit }}-

      - name: 构建 llama.xcframework（缓存未命中时）
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        working-directory: ios-app
        run: |
          set -euo pipefail
          MINIMAL_MODE=ios ./scripts/build_xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGN_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.SIGN_CERT_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.SIGN_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.SIGN_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive (signed)
        working-directory: ios-app
        env:
          TEAM: ${{ secrets.SIGN_TEAM_ID }}
          PROFILE_SPEC: ${{ secrets.SIGN_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project StockInventoryApp.xcodeproj \
            -scheme StockInventoryApp \
            -configuration Release \
            -archivePath build/StockInventoryApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=manual \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPEC"

      - name: Assert Info.plist 含隐私权限键
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/StockInventoryApp.xcarchive/Products -name '*.app' | head -n 1)
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            plutil -extract "$key" raw "$APP_PATH/Info.plist" > /dev/null \
              || { echo "::error::$key missing from bundle Info.plist!"; exit 1; }
          done
          echo "Info.plist 隐私权限键校验通过"

      - name: Export signed IPA
        working-directory: ios-app
        env:
          TEAM: ${{ secrets.SIGN_TEAM_ID }}
        run: |
          set -euo pipefail
          # 用仓库里的模板，并把 teamID 替换为实际值
          sed -i '' "s/YOUR_TEAM_ID/$TEAM/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/StockInventoryApp.xcarchive \
            -exportPath build/signed \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockInventoryApp-signed-ipa
          path: ios-app/build/signed/*.ipa
          retention-days: 30
          if-no-files-found: error
