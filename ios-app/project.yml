name: StockInventoryApp
options:
  bundleIdPrefix: com.stockmanager
  deploymentTarget:
    iOS: "17.0"
targets:
  StockInventoryApp:
    type: application
    platform: iOS
    sources:
      - path: StockInventoryApp
    info:
      path: StockInventoryApp/Info.plist
schemes:
  StockInventoryApp:
    build:
      targets:
        StockInventoryApp: all
    run:
      config: Release
    archive:
      config: Release
