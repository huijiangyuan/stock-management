name: StockInventoryApp
options:
  bundleIdPrefix: com.stockmanager
  deploymentTarget:
    iOS: "17.0"
packages:
  NextLevel:
    path: Vendor/NextLevel
targets:
  StockInventoryApp:
    type: application
    platform: iOS
    sources:
      - path: StockInventoryApp
    # 预构建的 llama.cpp-omni 推理框架（CI / 本地由 scripts/build_xcframework.sh 生成）。
    # 必须用 dependencies.framework 方式声明，XcodeGen 才会同时 link + embed；
    # 若仅放进 sources，只会被 copy/embed，不会往链接器传 -framework llama，
    # 导致 mb_mtmd_* / mtmd_* 等符号 undefined。
    dependencies:
      - package: NextLevel
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        # 单一事实来源：直接用手写 Info.plist，禁止 XcodeGen 覆写
        # （此前只用 info.path 导致 XcodeGen 每次 generate 把权限键抹掉，
        #  产物缺 NSCameraUsageDescription → 相机 TCC SIGABRT 闪退）
        INFOPLIST_FILE: StockInventoryApp/Info.plist
        # 原生 ObjC++ 桥（MBMtmd.mm）需要 C++20
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        GCC_C_LANGUAGE_STANDARD: gnu11
        # Swift 调用 ObjC++ 桥，必须开 objcxx 互操作
        SWIFT_OBJC_BRIDGING_HEADER: StockInventoryApp/OnDevice/StockInventoryApp-Bridging-Header.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
        DEFINES_MODULE: true
        # llama.xcframework 的 Headers 由 framework 的 modulemap 提供，search path 留空即可
        HEADER_SEARCH_PATHS: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)"
          - "$(PROJECT_DIR)/StockInventoryApp"
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SDKROOT)/usr/lib/swift"
  StockInventoryAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockInventoryAppTests
    dependencies:
      - target: StockInventoryApp
schemes:
  StockInventoryApp:
    build:
      targets:
        StockInventoryApp: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - StockInventoryAppTests
    archive:
      config: Release
